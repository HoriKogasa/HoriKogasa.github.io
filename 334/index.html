  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;

}

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

svg {

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;tweet-time-calibrator&quot;&gt;
  &lt;style&gt;

      &lt;/label&gt;

        &lt;tbody id=&quot;ttc-sample-body&quot;&gt;&lt;tr&gt;&lt;td&gt;まだありません&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;

        &lt;input class=&quot;form-control&quot; id=&quot;ttc-device-offset&quot; type=&quot;number&quot; min=&quot;-60000&quot; max=&quot;60000&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;

      &lt;span class=&quot;text-muted&quot;&gt;投稿操作まで &lt;/span&gt;&lt;strong id=&quot;ttc-live-countdown&quot;&gt;未設定&lt;/strong&gt;

    &lt;a class=&quot;text-small&quot; href=&quot;https://time.now&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;時刻API: Time.Now&lt;/a&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;tweet-time-calibrator&#x27;);
      if (!root || root.dataset.ready === &#x27;true&#x27;) return;
      root.dataset.ready = &#x27;true&#x27;;

      const byId = id =&gt; document.getElementById(id);
      const ui = {
        trueClock: byId(&#x27;ttc-true-clock&#x27;), shiftClock: byId(&#x27;ttc-shift-clock&#x27;), date: byId(&#x27;ttc-date&#x27;),
        nextTenText: byId(&#x27;ttc-next-ten-text&#x27;), copyNextTen: byId(&#x27;ttc-copy-next-ten&#x27;),
        shiftNote: byId(&#x27;ttc-shift-note&#x27;), shiftCard: byId(&#x27;ttc-shift-card&#x27;),
        gaugeSource: byId(&#x27;ttc-gauge-source&#x27;),
        minuteGauge: byId(&#x27;ttc-minute-gauge&#x27;), tenGauge: byId(&#x27;ttc-ten-gauge&#x27;), secondGauge: byId(&#x27;ttc-second-gauge&#x27;),
        minuteLabel: byId(&#x27;ttc-minute-label&#x27;), tenLabel: byId(&#x27;ttc-ten-label&#x27;),
        boundaryLabel: byId(&#x27;ttc-boundary-label&#x27;), msLabel: byId(&#x27;ttc-ms-label&#x27;),
        observed: byId(&#x27;ttc-observed&#x27;), addSample: byId(&#x27;ttc-add-sample&#x27;), clearSamples: byId(&#x27;ttc-clear-samples&#x27;),
        sampleBody: byId(&#x27;ttc-sample-body&#x27;), lag: byId(&#x27;ttc-lag&#x27;), deviceOffset: byId(&#x27;ttc-device-offset&#x27;),
        syncClock: byId(&#x27;ttc-sync-clock&#x27;), syncStatus: byId(&#x27;ttc-sync-status&#x27;),
        preset: byId(&#x27;ttc-preset&#x27;), liveText: byId(&#x27;ttc-live-text&#x27;), copyLive: byId(&#x27;ttc-copy-live&#x27;),
        liveTarget: byId(&#x27;ttc-live-target&#x27;), liveNext: byId(&#x27;ttc-live-next&#x27;),
        liveCountdown: byId(&#x27;ttc-live-countdown&#x27;)
      };

      const presets = {
        sharoho: {hour:0, minute:0, text:&#x27;しゃろほー&#x27;},
        &#x27;334&#x27;: {hour:3, minute:34, text:&#x27;334&#x27;},
        asa4: {hour:4, minute:0, text:&#x27;おはよう!朝4時に何してるんだい?&#x27;},
        hiruho: {hour:12, minute:0, text:&#x27;ひるほー&#x27;}
      };

      const todayKey = () =&gt; {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,&#x27;0&#x27;)}-${String(d.getDate()).padStart(2,&#x27;0&#x27;)}`;
      };
      const storeKey = `tweet-time-calibrator:${todayKey()}`;
      let samples = [];

      function readNumber(input) {
        const value = Number(input.value);
        return Number.isFinite(value) ? value : 0;
      }
      function legacyCopy(text) {
        const textarea = document.createElement(&#x27;textarea&#x27;);
        textarea.value = text;
        textarea.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
        textarea.style.position = &#x27;absolute&#x27;;
        textarea.style.left = &#x27;-9999px&#x27;;
        root.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, text.length);
        let copied = false;
        try { copied = document.execCommand(&#x27;copy&#x27;); } catch (_) {}
        textarea.remove();
        return copied;
      }
      async function copyToClipboard(text) {
        if (window.location.protocol === &#x27;file:&#x27;) return legacyCopy(text);
        try {
          if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {}
        return legacyCopy(text);
      }
      function formatClock(ms) {
        const d = new Date(ms);
        return `${String(d.getHours()).padStart(2,&#x27;0&#x27;)}:${String(d.getMinutes()).padStart(2,&#x27;0&#x27;)}:${String(d.getSeconds()).padStart(2,&#x27;0&#x27;)}.${String(d.getMilliseconds()).padStart(3,&#x27;0&#x27;)}`;
      }
      function formatCompactClock(ms) {
        const d = new Date(ms);
        return `${String(d.getHours()).padStart(2,&#x27;0&#x27;)}${String(d.getMinutes()).padStart(2,&#x27;0&#x27;)}${String(d.getSeconds()).padStart(2,&#x27;0&#x27;)}`;
      }
      function formatDate(ms) {
        return new Intl.DateTimeFormat(&#x27;ja-JP&#x27;, {year:&#x27;numeric&#x27;, month:&#x27;2-digit&#x27;, day:&#x27;2-digit&#x27;, weekday:&#x27;short&#x27;}).format(new Date(ms));
      }
      function toLocalInput(ms) {
        const d = new Date(ms);
        const parts = [d.getFullYear(), String(d.getMonth()+1).padStart(2,&#x27;0&#x27;), String(d.getDate()).padStart(2,&#x27;0&#x27;)];
        const time = [String(d.getHours()).padStart(2,&#x27;0&#x27;), String(d.getMinutes()).padStart(2,&#x27;0&#x27;), String(d.getSeconds()).padStart(2,&#x27;0&#x27;)];
        return `${parts.join(&#x27;-&#x27;)}T${time.join(&#x27;:&#x27;)}`;
      }
      function parseTarget(input) {
        const ms = new Date(input.value).getTime();
        return Number.isFinite(ms) ? ms : null;
      }
      function nextWholeMinute(baseMs) {
        return Math.ceil((baseMs + 2500) / 60000) * 60000;
      }
      function formatRemaining(ms) {
        const sign = ms &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;;
        const abs = Math.abs(ms);
        if (abs &gt;= 60000) return `${sign}${Math.floor(abs/60000)}:${String(Math.floor((abs%60000)/1000)).padStart(2,&#x27;0&#x27;)}.${String(Math.floor(abs%1000)).padStart(3,&#x27;0&#x27;)}`;
        return `${sign}${(abs/1000).toFixed(3)} 秒`;
      }
      function median(values) {
        if (!values.length) return 0;
        const sorted = [...values].sort((a,b) =&gt; a-b);
        const middle = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[middle] : Math.round((sorted[middle-1] + sorted[middle]) / 2);
      }
      function save() {
        try {
          localStorage.setItem(storeKey, JSON.stringify({samples, lag:readNumber(ui.lag), deviceOffset:readNumber(ui.deviceOffset)}));
        } catch (_) {}
      }
      function load() {
        try {
          const data = JSON.parse(localStorage.getItem(storeKey) || &#x27;{}&#x27;);
          samples = Array.isArray(data.samples) ? data.samples.filter(Number.isFinite) : [];
          if (Number.isFinite(data.lag)) ui.lag.value = data.lag;

      function renderSamples() {

          return;
        }
        const adopted = median(samples);
        ui.sampleBody.innerHTML = samples.map((value, index) =&gt; `&lt;tr&gt;&lt;td&gt;${index + 1} 回目&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${value &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${value} ms&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;${index === samples.length - 1 ? `${adopted &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${adopted} ms（中央値）` : &#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);

      ui.preset.addEventListener(&#x27;change&#x27;, () =&gt; {

      ui.liveNext.addEventListener(&#x27;click&#x27;, () =&gt; {

      ui.liveTarget.addEventListener(&#x27;change&#x27;, () =&gt; {

        const text = ui.liveText.textContent;
        if (await copyToClipboard(text)) {
          ui.copyLive.textContent = &#x27;コピー済み&#x27;;

        } else { ui.copyLive.textContent = &#x27;コピーできません&#x27;; }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

    );

    }

    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

      return;
    }

    }

    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);

  document.addEventListener(&quot;focusout&quot;, handleLeave);
